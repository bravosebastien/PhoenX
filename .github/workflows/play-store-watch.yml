name: Surveillance conformité Google Play

# ⚠️ CE QUE CE WORKFLOW FAIT RÉELLEMENT (et ce qu'il ne fait PAS) :
# Il compare le targetSdk/compileSdk RÉELLEMENT présents dans le code au
# chiffre de référence documenté dans docs/maintenance/echeances-play-store.md.
# Il ne fait AUCUNE recherche web automatique — GitHub Actions n'a pas accès
# à un moteur de recherche fiable sans clé d'API payante, et une fausse
# information générée sans vérification serait pire qu'une absence
# d'automatisation (voir CLAUDE.md, principe "description ≠ preuve").
#
# La vraie veille réglementaire (Google change ses exigences sans préavis)
# reste un geste humain : quand Sébastien ou Claude confirment un changement
# via une recherche réelle, ils mettent à jour la valeur de référence
# ci-dessous ET le fichier docs/maintenance/echeances-play-store.md dans le
# même commit. Ce workflow ne fait que vérifier que le CODE suit bien cette
# valeur documentée — pas que la valeur documentée est encore à jour.

on:
  schedule:
    # Le 1er de chaque mois à 08:00 UTC — sert de rappel récurrent pour
    # qu'un humain (ou Claude sur demande explicite) revérifie la valeur
    # de référence ci-dessous auprès de la documentation Google officielle.
    - cron: "0 8 1 * *"
  workflow_dispatch:

env:
  # Dernière valeur vérifiée manuellement le 27 septembre 2026 :
  # Google Play exige l'API 36 (Android 16) pour toute nouvelle soumission
  # ou mise à jour depuis le 31 août 2026. Source officielle :
  # https://support.google.com/googleplay/android-developer/answer/11926878
  REQUIRED_TARGET_SDK: 36
  REFERENCE_CHECKED_ON: "2026-09-27"

jobs:
  check-target-sdk:
    name: Vérifier le targetSdk face à l'exigence Google Play documentée
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Lire le targetSdk réel du projet
        id: read-sdk
        run: |
          CURRENT=$(grep -E "targetSdk\s*=\s*[0-9]+" app/build.gradle.kts | grep -oE "[0-9]+" | head -1)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "targetSdk actuel dans le code : $CURRENT"
          echo "targetSdk requis (documenté le $REFERENCE_CHECKED_ON) : $REQUIRED_TARGET_SDK"

      - name: Comparer et alerter si le code est en retard
        if: ${{ steps.read-sdk.outputs.current < env.REQUIRED_TARGET_SDK }}
        run: |
          echo "::error title=targetSdk obsolète::Le code cible l'API ${{ steps.read-sdk.outputs.current }}, alors que la dernière exigence Google Play documentée (vérifiée le $REFERENCE_CHECKED_ON) est l'API $REQUIRED_TARGET_SDK. Corriger app/build.gradle.kts avant la prochaine publication."
          exit 1

      - name: Rappel de fraîcheur de la valeur de référence
        run: |
          echo "========================================================="
          echo "Cette valeur de référence (API $REQUIRED_TARGET_SDK) a été"
          echo "vérifiée manuellement le $REFERENCE_CHECKED_ON."
          echo "Google peut annoncer une nouvelle exigence à tout moment,"
          echo "sans que ce workflow puisse le détecter seul."
          echo "→ Vérifier périodiquement :"
          echo "  https://support.google.com/googleplay/android-developer/answer/11926878"
          echo "  et mettre à jour REQUIRED_TARGET_SDK + le fichier"
          echo "  docs/maintenance/echeances-play-store.md si besoin."
          echo "========================================================="
