# Valeurs de secours pour la compilation quand local.properties n'existe
# pas (CI, ou nouvel environnement de développement sans clé réelle).
#
# Ce fichier EST commité volontairement — il ne contient AUCUN vrai
# secret, seulement des valeurs factices qui permettent au projet de
# compiler (le plugin com.google.android.libraries.mapsplatform.secrets-
# gradle-plugin l'utilise automatiquement en repli quand local.properties
# est absent).
#
# La vraie clé Google Maps continue de vivre UNIQUEMENT dans
# local.properties (jamais commité) sur chaque poste de développement.
# Une app compilée avec cette valeur factice ne pourra pas afficher de
# carte réelle (Mappemonde) — c'est attendu pour une compilation de
# vérification (CI), pas pour un vrai test sur appareil.

MAPS_API_KEY=DUMMY_KEY_FOR_CI_BUILD_ONLY
